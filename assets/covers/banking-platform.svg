<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e26"/><stop offset="1" stop-color="#0f1540"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0v26" fill="none" stroke="rgba(148,163,216,0.08)"/>
    </pattern>
    <radialGradient id="glow" cx="0.55" cy="0.45" r="0.75">
      <stop offset="0" stop-color="rgba(109,141,255,0.13)"/><stop offset="1" stop-color="rgba(109,141,255,0)"/>
    </radialGradient>
  </defs>
  <rect width="800" height="330" fill="url(#bg)"/>
  <rect width="800" height="330" fill="url(#grid)"/>
  <rect width="800" height="330" fill="url(#glow)"/>

  <!-- bank -->
  <g stroke="#6d8dff" stroke-width="2.8" fill="rgba(109,141,255,0.06)" stroke-linejoin="round" stroke-linecap="round">
    <path d="M96 138h192L192 76z"/>
    <path d="M118 138v92M158 138v92M226 138v92M266 138v92"/>
    <path d="M88 230h208"/>
  </g>

  <!-- transfer both ways: debit / credit -->
  <g stroke="#4cc9f0" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M330 142h84" stroke-dasharray="2 8"/>
    <path d="m406 134 10 8-10 8"/>
    <path d="M414 196h-84" stroke-dasharray="2 8"/>
    <path d="m338 188-10 8 10 8"/>
  </g>

  <!-- append-only double-entry ledger -->
  <rect x="446" y="66" width="264" height="198" rx="12" stroke="#a06bff" stroke-width="2.8" fill="rgba(160,107,255,0.06)"/>
  <path d="M578 82v166" stroke="rgba(160,107,255,0.45)" stroke-width="2"/>
  <path d="M462 106h232" stroke="rgba(160,107,255,0.45)" stroke-width="2"/>
  <!-- entries: every debit row has a matching credit row -->
  <g stroke="rgba(109,141,255,0.8)" stroke-width="5" stroke-linecap="round">
    <path d="M470 128h64M470 158h44M470 188h56M470 218h38"/>
  </g>
  <g stroke="rgba(76,201,240,0.8)" stroke-width="5" stroke-linecap="round">
    <path d="M594 128h64M594 158h44M594 188h56M594 218h38"/>
  </g>
  <!-- balanced totals -->
  <g stroke="rgba(148,163,216,0.7)" stroke-width="2.5" stroke-linecap="round">
    <path d="M470 242h92M594 242h92"/>
  </g>

  <!-- lock: invariants enforced -->
  <g stroke="#e8c55a" stroke-width="2.8" fill="rgba(232,197,90,0.08)" stroke-linejoin="round">
    <rect x="672" y="272" width="56" height="40" rx="8"/>
    <path d="M684 272v-12a16 16 0 0 1 32 0v12" fill="none"/>
  </g>
  <circle cx="700" cy="292" r="5" fill="#e8c55a"/>
</svg>
