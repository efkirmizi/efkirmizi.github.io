<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0e2c"/><stop offset="1" stop-color="#12143e"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0v26" fill="none" stroke="rgba(148,163,216,0.08)"/>
    </pattern>
    <radialGradient id="glow" cx="0.68" cy="0.5" r="0.6">
      <stop offset="0" stop-color="rgba(160,107,255,0.15)"/><stop offset="1" stop-color="rgba(160,107,255,0)"/>
    </radialGradient>
  </defs>
  <rect width="800" height="330" fill="url(#bg)"/>
  <rect width="800" height="330" fill="url(#grid)"/>
  <rect width="800" height="330" fill="url(#glow)"/>

  <!-- teacher network (large) -->
  <g stroke="rgba(109,141,255,0.35)" stroke-width="1.5">
    <path d="M120 75 190 95M120 75 190 145M120 125 190 95M120 125 190 195M120 175 190 145M120 175 190 245M120 225 190 195M120 225 190 95M120 275 190 245M120 275 190 195"/>
    <path d="M190 95 260 120M190 145 260 120M190 145 260 220M190 195 260 170M190 245 260 220M190 95 260 170"/>
  </g>
  <g fill="#0c0e2c" stroke="#6d8dff" stroke-width="2.5">
    <circle cx="120" cy="75" r="10"/><circle cx="120" cy="125" r="10"/><circle cx="120" cy="175" r="10"/><circle cx="120" cy="225" r="10"/><circle cx="120" cy="275" r="10"/>
    <circle cx="190" cy="95" r="10"/><circle cx="190" cy="145" r="10"/><circle cx="190" cy="195" r="10"/><circle cx="190" cy="245" r="10"/>
    <circle cx="260" cy="120" r="10"/><circle cx="260" cy="170" r="10"/><circle cx="260" cy="220" r="10"/>
  </g>

  <!-- distillation funnel -->
  <g stroke="#4cc9f0" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-dasharray="3 9">
    <path d="M300 85c90 10 130 45 190 62M300 255c90-10 130-45 190-62"/>
  </g>
  <path d="m482 139 12 8-4 14" stroke="#4cc9f0" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- knowledge tokens flowing through the funnel -->
  <g fill="#4cc9f0" opacity="0.8">
    <circle cx="352" cy="122" r="3.5"/><circle cx="410" cy="146" r="3"/>
    <circle cx="352" cy="218" r="3.5"/><circle cx="410" cy="194" r="3"/>
  </g>

  <!-- student network (compressed) -->
  <g stroke="rgba(160,107,255,0.5)" stroke-width="1.5">
    <path d="M560 140 640 165M560 190 640 165M560 140 640 195M560 190 640 195"/>
  </g>
  <g fill="#0c0e2c" stroke="#a06bff" stroke-width="2.8">
    <circle cx="560" cy="140" r="11"/><circle cx="560" cy="190" r="11"/>
    <circle cx="640" cy="165" r="11"/><circle cx="640" cy="195" r="11"/>
  </g>

  <!-- compression sparkle -->
  <g stroke="#e8c55a" stroke-width="2.5" stroke-linecap="round">
    <path d="M700 105v22M689 116h22M707 98l-14 14M707 112l-14-14" opacity="0.9"/>
  </g>
</svg>
