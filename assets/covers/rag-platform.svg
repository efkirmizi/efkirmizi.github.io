<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f26"/><stop offset="1" stop-color="#111740"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0v26" fill="none" stroke="rgba(148,163,216,0.08)"/>
    </pattern>
    <radialGradient id="glow" cx="0.45" cy="0.45" r="0.75">
      <stop offset="0" stop-color="rgba(76,201,240,0.12)"/><stop offset="1" stop-color="rgba(76,201,240,0)"/>
    </radialGradient>
  </defs>
  <rect width="800" height="330" fill="url(#bg)"/>
  <rect width="800" height="330" fill="url(#grid)"/>
  <rect width="800" height="330" fill="url(#glow)"/>

  <!-- documents (corpus) -->
  <g stroke="#6d8dff" stroke-width="2.5" fill="rgba(109,141,255,0.07)" stroke-linejoin="round">
    <rect x="104" y="124" width="88" height="112" rx="8"/>
    <rect x="88" y="108" width="88" height="112" rx="8"/>
    <rect x="72" y="92" width="88" height="112" rx="8"/>
  </g>
  <g stroke="rgba(109,141,255,0.65)" stroke-width="2.5" stroke-linecap="round">
    <path d="M88 118h44M88 136h56M88 154h48M88 172h56"/>
  </g>

  <!-- flow into the ACL gate -->
  <g stroke="#4cc9f0" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M208 165h74" stroke-dasharray="2 8"/>
    <path d="m274 157 10 8-10 8" fill="none"/>
  </g>

  <!-- ACL shield: permissions filter retrieval itself -->
  <g stroke="#4cc9f0" stroke-width="3" fill="rgba(76,201,240,0.08)" stroke-linejoin="round" stroke-linecap="round">
    <path d="M348 96l46 19v38c0 34-19 55-46 68-27-13-46-34-46-68v-38z"/>
  </g>
  <path d="m328 164 15 15 27-30" stroke="#4cc9f0" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- embedding dots drifting through -->
  <g fill="#a06bff" opacity="0.75">
    <circle cx="238" cy="120" r="3.5"/><circle cx="262" cy="205" r="3"/>
    <circle cx="252" cy="146" r="2.5"/><circle cx="240" cy="186" r="2.5"/>
  </g>

  <!-- gate to ranked results -->
  <g stroke="#a06bff" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M412 165h58" stroke-dasharray="2 8"/>
    <path d="m462 157 10 8-10 8"/>
  </g>

  <!-- reranked, cited results -->
  <g stroke-linejoin="round">
    <rect x="492" y="104" width="230" height="30" rx="8" stroke="#a06bff" stroke-width="2.5" fill="rgba(160,107,255,0.14)"/>
    <rect x="492" y="150" width="188" height="30" rx="8" stroke="rgba(109,141,255,0.75)" stroke-width="2.5" fill="rgba(109,141,255,0.07)"/>
    <rect x="492" y="196" width="146" height="30" rx="8" stroke="rgba(109,141,255,0.45)" stroke-width="2.5" fill="rgba(109,141,255,0.05)"/>
  </g>
  <!-- citation markers on the top hit -->
  <g fill="#4cc9f0">
    <circle cx="700" cy="112" r="3"/><circle cx="710" cy="122" r="3"/>
  </g>
</svg>
