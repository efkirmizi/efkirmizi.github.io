<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0c2e"/><stop offset="1" stop-color="#101438"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0v26" fill="none" stroke="rgba(148,163,216,0.08)"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="rgba(160,107,255,0.14)"/><stop offset="1" stop-color="rgba(160,107,255,0)"/>
    </radialGradient>
  </defs>
  <rect width="800" height="330" fill="url(#bg)"/>
  <rect width="800" height="330" fill="url(#grid)"/>
  <rect width="800" height="330" fill="url(#glow)"/>

  <!-- board -->
  <g stroke="rgba(109,141,255,0.35)" stroke-width="1.8" fill="none">
    <rect x="184" y="57" width="432" height="216" rx="8"/>
    <path d="M256 57v216M328 57v216M400 57v216M472 57v216M544 57v216"/>
    <path d="M184 129h432M184 201h432"/>
  </g>

  <!-- walls -->
  <rect x="256" y="57" width="72" height="72" fill="rgba(148,163,216,0.14)"/>
  <rect x="472" y="201" width="72" height="72" fill="rgba(148,163,216,0.14)"/>
  <rect x="328" y="201" width="72" height="72" fill="rgba(148,163,216,0.08)"/>

  <!-- conveyor tiles -->
  <g stroke="rgba(76,201,240,0.7)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="m488 84 12 9-12 9M508 84l12 9-12 9"/>
    <path d="m296 220-12 9 12 9M316 220l-12 9 12 9"/>
  </g>

  <!-- mirrored players -->
  <circle cx="220" cy="165" r="22" stroke="#6d8dff" stroke-width="3" fill="rgba(109,141,255,0.18)"/>
  <circle cx="580" cy="165" r="22" stroke="#a06bff" stroke-width="3" fill="rgba(160,107,255,0.18)"/>
  <!-- one keypress, opposite moves -->
  <g stroke="#6d8dff" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M250 165h44M282 157l12 8-12 8"/>
  </g>
  <g stroke="#a06bff" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M550 165h-44M518 157l-12 8 12 8"/>
  </g>

  <!-- merge tile: the goal -->
  <rect x="364" y="129" width="72" height="72" fill="rgba(76,201,240,0.10)"/>
  <circle cx="400" cy="165" r="26" stroke="#4cc9f0" stroke-width="2.5" fill="none" stroke-dasharray="6 7"/>
  <circle cx="400" cy="165" r="8" fill="#4cc9f0"/>

  <!-- search tree growing beneath the board -->
  <g stroke="rgba(148,163,216,0.5)" stroke-width="2" fill="none">
    <path d="M400 273v22M400 295l-52 18M400 295l52 18M348 313l-24 12M348 313l24 12"/>
  </g>
  <g fill="#0d0c2e" stroke="#4cc9f0" stroke-width="2.2">
    <circle cx="400" cy="295" r="6"/>
    <circle cx="348" cy="313" r="6"/>
    <circle cx="452" cy="313" r="6"/>
  </g>
</svg>
