<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e26"/><stop offset="1" stop-color="#121238"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0v26" fill="none" stroke="rgba(148,163,216,0.08)"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="rgba(109,141,255,0.12)"/><stop offset="1" stop-color="rgba(109,141,255,0)"/>
    </radialGradient>
  </defs>
  <rect width="800" height="330" fill="url(#bg)"/>
  <rect width="800" height="330" fill="url(#grid)"/>
  <rect width="800" height="330" fill="url(#glow)"/>

  <!-- strict four-layer architecture, dependencies point one way -->
  <rect x="300" y="40" width="200" height="40" rx="9" stroke="#6d8dff" stroke-width="2.6" fill="rgba(109,141,255,0.08)"/>
  <rect x="280" y="102" width="240" height="40" rx="9" stroke="#6d8dff" stroke-width="2.6" fill="rgba(109,141,255,0.06)"/>
  <rect x="260" y="164" width="280" height="40" rx="9" stroke="#a06bff" stroke-width="2.6" fill="rgba(160,107,255,0.07)"/>
  <g stroke="#4cc9f0" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M400 80v14M400 142v14M400 204v14"/>
    <path d="m394 88 6 8 6-8M394 150 400 158l6-8M394 212l6 8 6-8"/>
  </g>

  <!-- MySQL cylinder -->
  <g stroke="#4cc9f0" stroke-width="2.8" fill="rgba(76,201,240,0.07)" stroke-linecap="round">
    <ellipse cx="400" cy="240" rx="66" ry="16"/>
    <path d="M334 240v40c0 9 30 16 66 16s66-7 66-16v-40"/>
  </g>

  <!-- hand-written SQL: code brackets beside the repo layer -->
  <g stroke="#a06bff" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="m214 168-22 16 22 16M240 160l-14 48"/>
  </g>

  <!-- row locks: SELECT … FOR UPDATE -->
  <g stroke="#e8c55a" stroke-width="2.6" fill="rgba(232,197,90,0.08)" stroke-linejoin="round">
    <rect x="580" y="196" width="46" height="34" rx="7"/>
    <path d="M590 196v-10a13 13 0 0 1 26 0v10" fill="none"/>
  </g>
  <!-- test shield -->
  <g stroke="#4ade80" stroke-width="2.6" fill="rgba(74,222,128,0.06)" stroke-linejoin="round" stroke-linecap="round">
    <path d="M603 60l30 12v25c0 22-12 36-30 44-18-8-30-22-30-44V72z"/>
    <path d="m590 104 10 10 18-20" fill="none"/>
  </g>
</svg>
